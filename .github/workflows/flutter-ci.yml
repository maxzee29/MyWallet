name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build release APK artifacts"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.MYWALLET_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/mywallet-release.p12
            printf 'storeFile=mywallet-release.p12\nstorePassword=mywallet-signing\nkeyPassword=mywallet-signing\nkeyAlias=mywallet\n' > android/key.properties
            echo "Memakai keystore tetap dari secret MYWALLET_KEYSTORE_B64."
          else
            echo "::warning::Secret MYWALLET_KEYSTORE_B64 belum diisi. APK memakai debug signing yang berubah setiap build."
          fi

      - name: Build split APK
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mywallet-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
