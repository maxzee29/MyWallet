name: Apply patch

on:
  push:
    branches: [main]
    paths:
      - "patch.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply patch.zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply patch.zip
        run: |
          if [ ! -f patch.zip ]; then
            echo "patch.zip tidak ditemukan di root repo."
            exit 1
          fi
          unzip -o patch.zip -d . -x ".github/*"
          rm patch.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Apply patch"
            git push
          fi
